<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel Valquiria</title>
    <link rel="stylesheet" href="estilos/global.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  </head>
  <body>
    <section class="dashboard">
      <!-- Menú lateral -->
      <nav class="sidebar">
        <div class="logo">
          <img src="img/logo-valquiria.png" alt="Logo Hotel Valquiria" />
        </div>
        <ul class="menu">
          <li onclick="cargarPagina('inicio')"><i class="fa-solid fa-house"></i> <span>Inicio</span></li>
          <li onclick="cargarPagina('dashboard')"><i class="fa-solid fa-chart-pie"></i> <span>Dashboard</span></li>
          <li onclick="cargarPagina('reservas')"><i class="fa-solid fa-calendar-check"></i> <span>Reservas</span></li>
          <li onclick="cargarPagina('servicios')"><i class="fa-solid fa-bell-concierge"></i> <span>Servicios</span></li>
          <li onclick="cargarPagina('habitaciones')"><i class="fa-solid fa-bed"></i> <span>Habitaciones</span></li>
        </ul>
      </nav>

      <!-- Contenedor del contenido dinámico -->
      <div id="contenido-principal"></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </body>
</html>
